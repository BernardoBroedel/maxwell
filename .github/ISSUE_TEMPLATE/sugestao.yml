name: Sugestão
description: Ideia de melhoria, novo tema ou novo modo.
title: "[Sugestão] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Toda ideia é bem-vinda! Se você já tem o conteúdo pronto (uma resolução, um resumo), use o formulário **Enviar conteúdo**.
  - type: dropdown
    id: tipo
    attributes:
      label: Que tipo de sugestão?
      options:
        - Novo tema que o Maxwell deveria cobrir
        - Melhoria num modo que já existe
        - Novo modo
        - Outro
    validations:
      required: true
  - type: textarea
    id: descricao
    attributes:
      label: Descreva a sugestão
      placeholder: "Ex.: Seria útil o Maxwell explicar a carta de Smith com um passo a passo desenhado."
    validations:
      required: true
  - type: textarea
    id: exemplo
    attributes:
      label: Exemplo (opcional)
      description: Uma pergunta que você faria, ou como imagina a resposta.
